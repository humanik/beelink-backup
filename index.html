<h1>beelink-backup</h1>
<p>A private, single-user backup tool. It uses <a href="https://restic.net">restic</a> and <a href="https://rclone.org">rclone</a> to store encrypted backups of a home server in the owner's own Google Drive.</p>
<p>The app requests only the <code>drive.file</code> scope, so it can access only the files it creates itself. It is not offered to the public.</p>
<p><a href="privacy.html">Privacy policy</a></p>
